name: 🌅 DAYS-BOT V6.1 — Premarket Watchlist Generator

on:
  schedule:
    # רץ בימים שני עד שישי בשעה 11:30 UTC (שזה 07:30 בבוקר שעון ניו יורק - פרימרקט)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # מאפשר הפעלה ידנית בלחיצת כפתור

jobs:
  premarket_scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # מעניק הרשאה לבוט לדחוף עדכוני קבצים בחזרה ל-Repository
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # מגדיר גרסת פייתון יציבה

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests pytz
          # שים לב: לא מתקינים כאן python-dotenv כי הקוד שלך כבר מטפל בזה ב-try/except!

      - name: Run Premarket Scanner
        env:
          # כאן מתבצע הסנכרון המלא בין ה-Secrets של GitHub למשתני הסביבה בקוד שלך:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python trading_bot.py premarket # הארגומנט תואם בדיוק ל-sys.argv בקוד

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # בודק אם נוצרו או השתנו קבצים (כמו daily_watchlist.csv או portfolio_state.json)
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "🤖 [Automated] Update watchlist and bot state [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
